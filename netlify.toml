[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Single-page app: let client routing handle /update and any other path.
# Function routes (/.netlify/functions/*) are matched before this rule.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
