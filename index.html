<!doctype html>
<html lang="da">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />

  <body>
    <!-- Hidden static form so Netlify registers "member-submission" (incl. file upload) at build time -->
    <form name="member-submission" netlify netlify-honeypot="bot-field" hidden>
      <input type="text" name="type" />
      <input type="text" name="name" />
      <textarea name="description"></textarea>
      <input type="url" name="website" />
      <input type="text" name="language" />
      <input type="file" name="logo" />
      <input type="email" name="email" />
      <textarea name="bio"></textarea>
      <input type="tel" name="phone" />
      <input type="text" name="contact1_name" />
      <input type="email" name="contact1_email" />
      <input type="tel" name="contact1_phone" />
      <input type="text" name="contact1_title" />
      <input type="text" name="contact2_name" />
      <input type="email" name="contact2_email" />
      <input type="tel" name="contact2_phone" />
      <input type="text" name="contact2_title" />
      <input type="text" name="contact3_name" />
      <input type="email" name="contact3_email" />
      <input type="tel" name="contact3_phone" />
      <input type="text" name="contact3_title" />
      <input type="text" name="contact4_name" />
      <input type="email" name="contact4_email" />
      <input type="tel" name="contact4_phone" />
      <input type="text" name="contact4_title" />
      <input type="text" name="contact5_name" />
      <input type="email" name="contact5_email" />
      <input type="tel" name="contact5_phone" />
      <input type="text" name="contact5_title" />
      <input type="text" name="bot-field" />
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
